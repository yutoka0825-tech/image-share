<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="5">
<title>Image Share</title>
</head>

<body style="font-family:sans-serif;text-align:center;">

<h1 style="font-size:48px;">
📷 スマホでQRを読み取ってください
</h1>

<img
src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://image-share-n51o.onrender.com/upload/{{ room }}"
width="400"
height="400"
>

<p style="font-size:28px;">
画像を送信してください
</p>

<hr>

<h2 style="font-size:36px;">
受信画像一覧
</h2>

<div style="
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
">

{% for image in images %}

<div>

<img
src="/uploads/{{ image }}"
style="
width:250px;
height:250px;
object-fit:cover;
border:1px solid #ccc;
border-radius:10px;
">

</div>

{% endfor %}

</div>

</body>
</html>
