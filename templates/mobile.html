<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像送信</title>
</head>

<body style="
    text-align:center;
    font-family:sans-serif;
    margin-top:50px;
">

<h1 style="font-size:48px;">
<font color=red>
📷 画像送信
</font>
</h1>

<form method="POST" enctype="multipart/form-data">

    <input
        type="file"
        name="image"
        style="font-size:30px;"
    >

    <br><br><br>

    <button
        type="submit"
        style="
            font-size:32px;
            padding:20px 40px;
            border-radius:15px;
            background:#0078d7;
            color:white;
            border:none;
        "
    >
        送信
    </button>

</form>

</body>
</html>
