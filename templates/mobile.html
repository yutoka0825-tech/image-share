<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像送信</title>
</head>

<body style="
text-align:center;
font-family:sans-serif;
padding-top:80px;
">

📷画像送信

padding:15px 40px;
">

</button>

</form>

</html>
